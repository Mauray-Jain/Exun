<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Saturday Night Live RSVP</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Courgette&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/form.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div id="logo"><img src="assets/logo.jpeg" alt="" /></div>
        <div id="links">
          <a href="/index.html" target="_blank">About</a>
          <a href="/form.html" target="_self">RSVP Form</a>
          <a href="https://tesla.com" target="_blank">Buy a Tesla</a>
        </div>
      </nav>
    </header>
    <main>
      <form action="app.py">
        <div class="form-element">
          <label for="name">Name:</label>
          <input type="text" name="name" id="attendee-name" />
        </div>
        <div class="form-element">
          <label for="email">Email:</label>
          <input type="email" name="email" id="email" />
        </div>
        <div class="form-element">
          Gender:
          <input type="radio" name="gender" id="male" value="male" /><label
            for="male"
            >Male</label
          >
          <input type="radio" name="gender" id="female" value="female" /><label
            for="female"
            >Female</label
          >
        </div>
        <div class="form-element">
          <label for="address">Postal Address:</label>
          <input type="text" name="address" id="address" />
        </div>
        <div class="form-element">
          <label for="age">Age:</label>
          <input type="number" name="age" id="age" />
        </div>
        <div class="form-element">
          <label for="phone-number">Contact Number with Country Code</label>
          <input type="number" name="number" id="phone-number" />
        </div>
        <div class="form-element">
          <label for="car">Tesla you possess:</label>
          <input type="text" name="car" id="car" />
        </div>
        <div class="form-element">
          <label for="excited">Are you excited?</label>
          <input type="checkbox" name="excited" id="excited" checked />
        </div>
        <div class="form-element" id="textarea">
          <label for="technoking"
            >How much do you like our saviour Elon Musk and his jokes?</label
          >
          <textarea
            name="technoking"
            id="technoking"
            cols="30"
            rows="10"
            placeholder="Write about your liking for the Technoking"
          ></textarea>
        </div>
        <div class="form-element">
          <input type="submit" value="Submit Now!" />
          <input type="reset" value="Reset" />
        </div>
      </form>
    </main>
  </body>
</html>
